<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BongoBay — Premium Page Transition</title>
<style>
:root{--ink:#171515;--paper:#f6f3ed;--white:#fff;--muted:#6d6861;--line:#d9d3c9;--accent:#e85f36;--ease:cubic-bezier(.76,0,.24,1)}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif} body{overflow-x:hidden}
.loader{position:fixed;inset:0;z-index:9999;background:var(--paper);display:grid;grid-template-rows:1fr auto;padding:clamp(20px,4vw,56px);transition:visibility 0s 1.05s;visibility:visible}
.loader.is-out{visibility:hidden}.loader__stage{display:grid;place-items:center;position:relative}.loader__mark{width:min(72vw,760px);position:relative;overflow:hidden;clip-path:inset(0 100% 0 0);animation:logoReveal 1.15s var(--ease) .14s forwards}.loader__mark img{display:block;width:100%;height:auto;mix-blend-mode:multiply}.loader__mark:after{content:"";position:absolute;right:0;top:7%;bottom:7%;width:2px;background:var(--accent);box-shadow:0 0 18px rgba(232,95,54,.35)}
.loader__meta{display:flex;align-items:end;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--muted)}
.loader__count{font-size:clamp(34px,6vw,72px);line-height:.8;letter-spacing:-.06em;color:var(--ink);font-variant-numeric:tabular-nums}.loader__bar{position:absolute;left:0;bottom:-12px;width:100%;height:1px;background:var(--line)}.loader__bar span{display:block;width:0;height:100%;background:var(--ink);animation:bar 1.65s var(--ease) forwards}
.loader.is-leaving{animation:curtainUp 1s var(--ease) forwards}.loader.is-leaving .loader__mark{transform:translateY(-14px);opacity:0;transition:.5s ease}.loader.is-leaving .loader__meta{opacity:0;transition:.35s ease}
@keyframes logoReveal{to{clip-path:inset(0 0 0 0)}}@keyframes bar{to{width:100%}}@keyframes curtainUp{0%{transform:translateY(0)}100%{transform:translateY(-102%)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}
.site{min-height:100vh;background:var(--paper)}.nav{height:82px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,72px);border-bottom:1px solid var(--line)}.nav img{width:154px;height:auto;mix-blend-mode:multiply}.nav__links{display:flex;gap:32px;align-items:center;font-size:13px}.nav a{color:inherit;text-decoration:none}.bag{border:1px solid var(--ink);padding:12px 16px;min-width:44px;text-align:center}
.hero{min-height:calc(100vh - 82px);padding:clamp(36px,7vw,100px) clamp(20px,5vw,72px);display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:end}.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:24px}.hero h1{font-size:clamp(54px,9vw,138px);line-height:.83;letter-spacing:-.075em;margin:0;max-width:900px;font-weight:700}.hero h1 span{display:block;color:var(--accent)}.hero__side{border-left:1px solid var(--line);padding-left:32px;align-self:end}.hero__side p{font-size:clamp(17px,2vw,23px);line-height:1.45;max-width:410px;margin:0 0 32px}.cta{display:inline-flex;align-items:center;justify-content:space-between;gap:28px;background:var(--ink);color:#fff;text-decoration:none;padding:18px 20px;min-width:220px;font-size:13px}.cta i{font-style:normal;font-size:20px}.note{position:fixed;right:18px;bottom:18px;background:#fff;border:1px solid var(--line);padding:10px 12px;font-size:11px;color:var(--muted);z-index:3}
@media(max-width:760px){.nav__links a:not(.bag){display:none}.hero{grid-template-columns:1fr;align-content:end}.hero__side{border-left:0;border-top:1px solid var(--line);padding:24px 0 0}.loader__meta{align-items:center}.loader__count{font-size:42px}.loader__mark{width:88vw}.note{display:none}}
</style>
</head>
